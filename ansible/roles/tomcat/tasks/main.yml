---
- name: Install boto3 and botocore for S3 module support
  ansible.builtin.dnf:
    name:
      - python3-boto3
      - python3-botocore
    state: present

- name: Install Java
  ansible.builtin.dnf:
    name: java-17-amazon-corretto
    state: present

- name: Install Tomcat
  ansible.builtin.dnf:
    name: tomcat9
    state: present

- name: Download vprofile application WAR file from S3
  amazon.aws.s3_object:
    bucket: vprofile-artifacts-747336059892
    object: app/vprofile-v2.war
    dest: /usr/share/tomcat9/webapps/vprofile.war
    mode: get
  notify: Restart Tomcat

- name: Start and enable Tomcat service
  ansible.builtin.service:
    name: tomcat9
    state: started
    enabled: true
